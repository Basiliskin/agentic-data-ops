[project]
name = "adops"
dynamic = ["version"]
description = "Open-source, self-hosted ELT/ETL pipelines: sync Postgres into a Postgres or DuckDB warehouse, transform with dbt, run data quality checks and reverse ETL, with an AI assistant over MCP."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Dimitry Katz" }]
keywords = [
    "etl", "elt", "reverse-etl", "data-engineering", "data-pipeline", "data-pipelines", "dataops",
    "data-quality", "data-warehouse", "schema-drift", "dbt", "dagster", "dlt", "postgres", "duckdb",
    "mcp", "ai-agent", "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dlt[postgres,duckdb]>=1.32,<2",
    # dagster and its integration libraries are released in lockstep; keep both minors pinned together.
    "dagster>=1.13.30,<1.14",
    "dagster-postgres>=0.29.30,<0.30",
    "dagster-webserver>=1.13.30,<1.14",
    "psycopg[binary]>=3.3,<4",
    "typer>=0.29,<0.30",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.2,<2",
    "dbt-core==1.12.7",
    "dbt-postgres==1.11.0",
    "dbt-duckdb==1.11.1",
    "duckdb==1.5.6",
    "mcp>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/Basiliskin/agentic-data-ops"
Source = "https://github.com/Basiliskin/agentic-data-ops"
Issues = "https://github.com/Basiliskin/agentic-data-ops/issues"

[project.scripts]
adops = "adops.interface.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17.5,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/adops/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/adops", "tests", "README.md", "LICENSE", "GLOSSARY.md", "pyproject.toml", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["src/adops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["e2e: runs the demo Project against real Postgres containers (needs Docker)"]

[tool.coverage.run]
branch = true
source = ["adops"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
