storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      db_name:
        env: DAGSTER_PG_DB
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD

# One run at a time on this Server: later runs wait in the queue.
run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

# Fails runs whose worker never started. No max_runtime_seconds: a run can wait through three
# 5-minute retries. No resuming: a retry always re-runs the whole Pipeline.
run_monitoring:
  enabled: true
  start_timeout_seconds: 180
  poll_interval_seconds: 120
  max_resume_run_attempts: 0

# Step output that Dagster captures stays in the Project's .adops/, which Git ignores.
compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /project/.adops/dagster/compute_logs

# No usage statistics are sent to Dagster, and its first-run notice about them is not shown.
telemetry:
  enabled: false
