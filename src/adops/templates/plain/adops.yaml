# Passwords are never written here: each *_env names a variable set in .env.
# Server failure alerts go to the URL in ALERT_WEBHOOK_URL; an empty value turns them off.
alert_webhook_env: ALERT_WEBHOOK_URL
environments:
  dev:
    warehouse:
      type: postgres
      host: localhost
      port: 5432
      database: warehouse
      user: warehouse
      password_env: WAREHOUSE_PASSWORD
    sources: {}
  # The release workflow (.github/workflows/adops-prod.yml) deploys to prod on its own Server
  # machine: uncomment this block and point it at that machine's Warehouse and Sources.
  # prod:
  #   warehouse:
  #     type: postgres
  #     host: localhost
  #     port: 5432
  #     database: warehouse
  #     user: warehouse
  #     password_env: WAREHOUSE_PASSWORD
  #   sources: {}
