name: shop_sync
steps:
  - name: sync_shop
    source: shop
    tables:
      - name: customers
        mode: full_refresh
        primary_key: id
        checks:
          - {type: not_null, column: email}
      - name: orders
        mode: incremental
        primary_key: id
        cursor: updated_at
        checks:
          - {type: min_rows, count: 1}
  - name: transform_shop
    type: transform
    project: dbt
  - name: reverse_sync_customer_stats
    type: reverse_sync
    model: customer_stats
    target: shop
    target_table: customer_stats
    key: customer_id
    mapping:
      customer_id: customer_id
      order_count: order_count
      total_amount: total_amount
      last_order_at: last_order_at
