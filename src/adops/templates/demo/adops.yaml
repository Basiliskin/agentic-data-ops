# Passwords are never written here: each *_env names a variable set in .env.
# Only an Environment named stage or prod writes to a target; dev prints a Preview instead,
# against its own copy of the target table in the shop_dev database.
# Server failure alerts go to the URL in ALERT_WEBHOOK_URL; an empty value turns them off.
alert_webhook_env: ALERT_WEBHOOK_URL
environments:
  dev:
    warehouse:
      type: postgres
      host: localhost
      port: 15433
      database: warehouse
      user: warehouse
      password_env: WAREHOUSE_PASSWORD
    # To keep the Warehouse in a local DuckDB file instead, replace the warehouse block above with:
    # warehouse:
    #   type: duckdb
    #   path: .adops/warehouse.duckdb
    sources:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
    targets:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop_dev
        user: shop
        password_env: SHOP_PASSWORD
  stage:
    warehouse:
      type: postgres
      host: localhost
      port: 15433
      database: warehouse_stage
      user: warehouse
      password_env: WAREHOUSE_PASSWORD
    # To keep the Warehouse in a local DuckDB file instead, replace the warehouse block above with:
    # warehouse:
    #   type: duckdb
    #   path: .adops/warehouse_stage.duckdb
    sources:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
    targets:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
  # This prod runs against the local Docker databases, apart from dev's and stage's. Before
  # pointing it at a real prod machine, edit host, port and database below.
  prod:
    warehouse:
      type: postgres
      host: localhost
      port: 15433
      database: warehouse_prod
      user: warehouse
      password_env: WAREHOUSE_PASSWORD
    # To keep the Warehouse in a local DuckDB file instead, replace the warehouse block above with:
    # warehouse:
    #   type: duckdb
    #   path: .adops/warehouse_prod.duckdb
    sources:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
    targets:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop_prod
        user: shop
        password_env: SHOP_PASSWORD
