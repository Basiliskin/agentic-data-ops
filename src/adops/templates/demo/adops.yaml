# Passwords are never written here: each *_env names a variable set in .env.
# Only an Environment named stage or prod writes to a target; dev prints a Preview instead.
# Server failure alerts go to the URL in ALERT_WEBHOOK_URL; an empty value turns them off.
alert_webhook_env: ALERT_WEBHOOK_URL
environments:
  dev:
    warehouse:
      type: postgres
      host: localhost
      port: 15433
      database: warehouse
      user: warehouse
      password_env: WAREHOUSE_PASSWORD
    # To keep the Warehouse in a local DuckDB file instead, replace the warehouse block above with:
    # warehouse:
    #   type: duckdb
    #   path: .adops/warehouse.duckdb
    sources:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
    targets:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
  stage:
    warehouse:
      type: postgres
      host: localhost
      port: 15433
      database: warehouse_stage
      user: warehouse
      password_env: WAREHOUSE_PASSWORD
    # To keep the Warehouse in a local DuckDB file instead, replace the warehouse block above with:
    # warehouse:
    #   type: duckdb
    #   path: .adops/warehouse_stage.duckdb
    sources:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
    targets:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
  # The release workflow (.github/workflows/adops-prod.yml) deploys to prod on its own Server
  # machine: uncomment this block and point it at that machine's Warehouse, Sources and Targets.
  # prod:
  #   warehouse:
  #     type: postgres
  #     host: localhost
  #     port: 15433
  #     database: warehouse
  #     user: warehouse
  #     password_env: WAREHOUSE_PASSWORD
  #   sources:
  #     shop:
  #       type: postgres
  #       host: localhost
  #       port: 15432
  #       database: shop
  #       user: shop
  #       password_env: SHOP_PASSWORD
  #   targets:
  #     shop:
  #       type: postgres
  #       host: localhost
  #       port: 15432
  #       database: shop
  #       user: shop
  #       password_env: SHOP_PASSWORD
