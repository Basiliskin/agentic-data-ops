# Passwords are never written here: each *_env names a variable set in .env.
environments:
  dev:
    warehouse:
      type: postgres
      host: localhost
      port: 15433
      database: warehouse
      user: warehouse
      password_env: WAREHOUSE_PASSWORD
    sources:
      shop:
        type: postgres
        host: localhost
        port: 15432
        database: shop
        user: shop
        password_env: SHOP_PASSWORD
